<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>陪玩·代肝管理后台 · COS电竞</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#0f1419; color:#e6e6e6; }
  .wrap { max-width:1100px; margin:0 auto; padding:16px 14px 40px; }

  header { display:flex; justify-content:space-between; align-items:center; padding:14px 0; flex-wrap:wrap; gap:10px; }
  header h1 { font-size:19px; color:#ffd24a; }
  header .sub { font-size:12px; color:#8a94a6; margin-top:4px; }
  .headlinks a { font-size:12px; color:#6fd3e8; text-decoration:none; margin-left:12px; }

  .stats { display:flex; gap:10px; margin:8px 0 14px; flex-wrap:wrap; }
  .stat { flex:1; min-width:100px; background:#1a212b; border:1px solid #2d3744; border-radius:10px; padding:11px 12px; }
  .stat .l { font-size:11px; color:#8a94a6; }
  .stat .v { font-size:21px; font-weight:800; color:#ffd24a; margin-top:3px; }
  .stat.g .v { color:#5fd97a; } .stat.o .v { color:#ffb24a; }

  .profit-box { background:#1a212b; border:1px solid #5e4a18; border-radius:11px; padding:12px 14px; margin:12px 0; }
  .pb-head { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .pb-title { font-size:15px; font-weight:800; color:#ffd24a; }
  .pb-mu { font-size:12px; color:#b8c0cc; display:flex; align-items:center; gap:6px; }
  .pb-mu input { width:64px; background:#0f1419; color:#e6e6e6; border:1px solid #2d3744; border-radius:7px; padding:7px 8px; font-size:13px; }
  .pb-stats { display:flex; gap:10px; flex-wrap:wrap; }
  .pb-stats .stat { flex:1; min-width:100px; }
  .t-profit { background:#2d220b; border-color:#5e4a18; color:#ffd24a; font-weight:800; }

  .bar { display:flex; gap:9px; background:#1a212b; padding:12px; border-radius:11px; flex-wrap:wrap; align-items:center; }
  .bar input, .bar select { background:#0f1419; color:#e6e6e6; border:1px solid #2d3744; border-radius:8px; padding:9px 10px; font-size:13px; min-width:110px; }
  .bar input.search { flex:1; min-width:150px; }
  .btn { border:none; border-radius:8px; padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .btn-y { background:#ffd24a; color:#0f1419; }
  .btn-b { background:#2d6cdf; color:#fff; }
  .btn-g { background:#1f5a35; color:#5fd97a; }
  .btn-r { background:#5a1f24; color:#ff8b8b; }
  .btn-d { background:#2d3744; color:#e6e6e6; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }

  .tabs { display:flex; gap:8px; margin:0 0 12px; flex-wrap:wrap; }
  .tab { border:1px solid #2d3744; background:#1a212b; color:#b8c0cc; border-radius:20px; padding:7px 16px; font-size:13px; font-weight:600; cursor:pointer; }
  .tab.active { background:#ffd24a; color:#0f1419; border-color:#ffd24a; }

  .bulk { display:none; align-items:center; gap:9px; background:#22303f; border:1px solid #2d6cdf; padding:10px 12px; border-radius:10px; margin-top:10px; flex-wrap:wrap; }
  .bulk.show { display:flex; }
  .bulk .n { font-size:13px; color:#6fd3e8; font-weight:700; }

  .list { margin-top:14px; display:flex; flex-direction:column; gap:9px; }
  .row { background:#1a212b; border:1px solid #2d3744; border-radius:11px; padding:11px 12px; display:flex; gap:11px; align-items:flex-start; }
  .row.sel { border-color:#2d6cdf; background:#1b2430; }
  .row .ck { margin-top:3px; width:17px; height:17px; flex-shrink:0; accent-color:#2d6cdf; cursor:pointer; }
  .row .body { flex:1; min-width:0; }
  .row .l1 { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .seq { font-size:13px; font-weight:800; color:#fff; background:#0f1419; border:1px solid #2d3744; border-radius:6px; padding:2px 7px; }
  .tag { font-size:11.5px; padding:3px 8px; border-radius:6px; background:#0f1419; border:1px solid #2d3744; color:#b8c0cc; }
  .t-type { background:#2a2410; border-color:#5e4a18; color:#ffd24a; font-weight:700; }
  .t-rank { background:#2a2410; border-color:#5e4a18; color:#ffd24a; font-weight:700; }
  .t-price { background:#2a2410; border-color:#5e4a18; color:#ffd24a; font-weight:800; }
  .badge { font-size:11px; padding:3px 9px; border-radius:20px; font-weight:600; }
  .ok { background:#16351f; color:#5fd97a; }
  .busy { background:#3a2a12; color:#ffb24a; }
  .maint { background:#2d2d2d; color:#aaa; }
  .row .l2 { font-size:11.5px; color:#8a94a6; margin-top:6px; line-height:1.5; word-break:break-word; }
  .row .idtxt { font-size:10.5px; color:#5a6474; margin-top:5px; }
  .row .acts { display:flex; gap:5px; flex-shrink:0; flex-wrap:wrap; justify-content:flex-end; max-width:210px; }
  .mini { border:none; border-radius:7px; padding:6px 9px; font-size:12px; cursor:pointer; font-weight:600; }
  .m-toggle { background:#2d3744; color:#ffd24a; }
  .m-edit { background:#2d6cdf; color:#fff; }
  .m-copy { background:#2d3744; color:#b8c0cc; }
  .m-del { background:#5a1f24; color:#ff8b8b; }
  .m-mv { background:#22303f; color:#8a94a6; padding:6px 8px; }
  @media (max-width:640px){
    .row { flex-wrap:wrap; }
    .row .acts { max-width:none; width:100%; justify-content:flex-start; border-top:1px solid #2d3744; padding-top:9px; margin-top:4px; }
  }

  .empty, .loading { text-align:center; color:#8a94a6; padding:36px 0; font-size:14px; }

  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:26px; background:#16351f; color:#5fd97a; border:1px solid #1f5a35; padding:12px 20px; border-radius:10px; font-size:14px; z-index:60; display:none; box-shadow:0 6px 20px rgba(0,0,0,.5); max-width:90%; text-align:center; }
  .toast.err { background:#3a1416; color:#ff8b8b; border-color:#7a2a2e; }
  .toast.show { display:block; }

  .mask { position:fixed; inset:0; background:rgba(0,0,0,.72); display:none; align-items:center; justify-content:center; z-index:50; padding:16px; overflow-y:auto; }
  .mask.show { display:flex; }
  .modal { position:relative; background:#1a212b; border:1px solid #2d3744; border-radius:14px; padding:20px; width:100%; max-width:520px; margin:auto; }
  .modal h3 { color:#ffd24a; font-size:17px; margin-bottom:6px; text-align:center; }
  .modal-close { position:absolute; top:12px; right:12px; width:30px; height:30px; border:none; border-radius:50%; background:#2d3744; color:#e6e6e6; font-size:20px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; transition:background .15s,color .15s; }
  .modal-close:hover { background:#3a4654; color:#fff; }
  .modal .mh { font-size:11.5px; color:#8a94a6; text-align:center; margin-bottom:12px; }
  .modal label { display:block; font-size:12px; color:#b8c0cc; margin:11px 0 4px; }
  .modal label .req { color:#ff6b6b; }
  .modal input, .modal select, .modal textarea { width:100%; background:#0f1419; color:#e6e6e6; border:1px solid #2d3744; border-radius:8px; padding:10px; font-size:14px; }
  .modal textarea { resize:vertical; min-height:54px; }
  .frow { display:flex; gap:10px; } .frow > div { flex:1; }
  @media (max-width:520px){ .frow { flex-wrap:wrap; } .frow > div { min-width:calc(50% - 5px); } }
  .radar-inputs { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:4px; }
  .radar-inputs > div label { display:block; font-size:11px; color:#b8c0cc; margin:0 0 4px; }
  .radar-inputs input { width:100%; }
  .radar-inputs input[type=range] { accent-color:#ffd24a; }
  .radar-inputs .rv { color:#ffd24a; font-weight:700; }
  .modal .foot { display:flex; gap:10px; margin-top:18px; }
  .modal .foot .btn { flex:1; padding:12px; font-size:14px; }

  #gate { position:fixed; inset:0; background:#0f1419; display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; }
  #gate .box { background:#1a212b; border:1px solid #2d3744; border-radius:14px; padding:26px 22px; width:100%; max-width:330px; text-align:center; }
  #gate h2 { color:#ffd24a; font-size:18px; margin-bottom:6px; }
  #gate p { font-size:12px; color:#8a94a6; margin-bottom:16px; }
  #gate input { width:100%; background:#0f1419; color:#e6e6e6; border:1px solid #2d3744; border-radius:8px; padding:12px; font-size:15px; text-align:center; }
  #gate button { width:100%; margin-top:12px; background:#ffd24a; color:#0f1419; border:none; border-radius:9px; padding:12px; font-size:15px; font-weight:700; cursor:pointer; }
  #gate .bad { color:#ff6b6b; font-size:12.5px; margin-top:10px; display:none; }
</style>
</head>
<body>

<!-- 登录门 -->
<div id="gate">
  <div class="box">
    <h2>🔐 管理后台</h2>
    <p>请输入管理密码</p>
    <input id="pw" type="password" placeholder="管理密码" autocomplete="current-password">
    <button onclick="tryLogin()">进入管理</button>
    <div class="bad" id="pwBad">密码不对，再试一次</div>
  </div>
</div>

<div class="wrap" id="app" style="display:none;">
  <header>
    <div>
      <h1>陪玩·代肝管理后台</h1>
      <div class="sub">所有改动直接写入 GitHub 数据文件，展示页几十秒内同步</div>
    </div>
    <div class="headlinks">
      <a href="gh-index.html" target="_blank">↗ 打开展示页</a>
      <a href="#" onclick="logout();return false;">退出</a>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><div class="l">总服务</div><div class="v" id="sTotal">—</div></div>
    <div class="stat g"><div class="l">陪玩</div><div class="v" id="sPw">—</div></div>
    <div class="stat o"><div class="l">代肝</div><div class="v" id="sDg">—</div></div>
    <div class="stat"><div class="l">忙碌中</div><div class="v" id="sBusy">—</div></div>
  </div>

  <div class="profit-box" id="profitBox">
    <div class="pb-head">
      <span class="pb-title">💰 利润汇总（按加价率自动算）</span>
      <span class="pb-mu">加价率 <input id="muInput" type="number" step="0.5" min="0" placeholder="10"> % <button class="btn btn-y" id="muSave" onclick="saveMarkup()">保存</button></span>
    </div>
    <div class="pb-stats">
      <div class="stat"><div class="l">总底价</div><div class="v" id="pBase">—</div></div>
      <div class="stat g"><div class="l">总营收(上架价)</div><div class="v" id="pListed">—</div></div>
      <div class="stat o"><div class="l">总利润</div><div class="v" id="pProfit">—</div></div>
    </div>
  </div>

  <div class="bar" id="toolbar">
    <input class="search" id="q" type="text" placeholder="搜索：昵称 / 擅长游戏 / 编号…" oninput="renderList()">
    <select id="fStatus" onchange="renderList()">
      <option value="">全部状态</option><option>可接</option><option>忙碌</option><option value="__other">其他/维护</option>
    </select>
    <button class="btn btn-y" onclick="openEdit(null)">＋ 新增接单</button>
    <button class="btn btn-d" onclick="reload(true)">↻ 刷新</button>
    <button class="btn btn-d" onclick="exportJson()">⤓ 备份</button>
    <button class="btn btn-d" onclick="openAnn()">📢 公告管理</button>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabPw" onclick="setType('陪玩')">🎮 陪玩</button>
    <button class="tab" id="tabDg" onclick="setType('代肝')">⚔️ 代肝</button>
    <button class="tab" id="tabAll" onclick="setType('')">全部</button>
    <button class="tab" id="tabOrders" onclick="showOrders()">📥 客户订单</button>
  </div>

  <div class="bulk" id="bulk">
    <span class="n" id="bulkN">已选 0 条</span>
    <button class="btn btn-g" onclick="bulkStatus('可接')">批量设为可接</button>
    <button class="btn btn-b" onclick="bulkStatus('忙碌')">批量设为忙碌</button>
    <button class="btn btn-r" onclick="bulkDelete()">批量删除</button>
    <button class="btn btn-d" onclick="clearSel()">取消选择</button>
  </div>

  <div class="list" id="list"><div class="loading">加载中…</div></div>

  <div class="list" id="ordersView" style="display:none;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
      <span class="cnt">📥 客户订单：你统一接单 → 派给打手 → 差价即利润（钱微信走，平台不代收）</span>
      <button class="btn btn-r" onclick="clearOrders()">清空全部订单</button>
    </div>
    <div id="orderSummary" style="background:#1a212b;border:1px solid #5e4a18;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:#b8c0cc;"></div>
    <div id="orderList"><div class="loading">加载中…</div></div>
  </div>
</div>

<!-- 编辑/新增弹窗 -->
<div class="mask" id="edMask">
  <div class="modal">
    <button class="modal-close" onclick="requestClose()" title="关闭" aria-label="关闭">×</button>
    <h3 id="edTitle">编辑服务</h3>
    <div class="mh" id="edSub"></div>
    <form id="edForm" onsubmit="return false;">
      <div class="frow">

          <select name="type">
            <option value="陪玩">陪玩</option>
            <option value="代肝">代肝</option>
          </select>

          <label>状态 <span class="req">*</span></label>
          <select name="status"><option>可接</option><option>忙碌</option><option>维护中</option></select>
        </div>
      </div>
      <div class="frow">
        <div><label>昵称 <span class="req">*</span></label><input name="name" placeholder="如 夜刃"></div>
        <div>
          <label>头像</label>
          <input name="avatar" placeholder="图片链接，或下方上传">
          <input type="file" accept="image/*" style="margin-top:6px;font-size:12px;color:#b8c0cc;" onchange="onAvatarFile(this)">
          <div id="avaPrev" style="margin-top:7px;display:none;"><img id="avaPrevImg" style="width:46px;height:46px;border-radius:50%;object-fit:cover;border:1px solid #2d3744;"></div>

      <textarea name="note" placeholder="服务要求等"></textarea>
      <label>自我特点（六边形雷达，每项 1–5 调节）</label>
      <div class="radar-inputs">
        <div><label>技术 <b class="rv" id="rv-tech">3</b></label><input type="range" name="tech" min="1" max="5" step="1" value="3" oninput="document.getElementById('rv-tech').textContent=this.value"></div>
        <div><label>沟通 <b class="rv" id="rv-comm">3</b></label><input type="range" name="comm" min="1" max="5" step="1" value="3" oninput="document.getElementById('rv-comm').textContent=this.value"></div>
        <div><label>耐心 <b class="rv" id="rv-patience">3</b></label><input type="range" name="patience" min="1" max="5" step="1" value="3" oninput="document.getElementById('rv-patience').textContent=this.value"></div>
        <div><label>效率 <b class="rv" id="rv-eff">3</b></label><input type="range" name="eff" min="1" max="5" step="1" value="3" oninput="document.getElementById('rv-eff').textContent=this.value"></div>
        <div><label>娱乐 <b class="rv" id="rv-fun">3</b></label><input type="range" name="fun" min="1" max="5" step="1" value="3" oninput="document.getElementById('rv-fun').textContent=this.value"></div>
        <div><label>靠谱 <b class="rv" id="rv-reliable">3</b></label><input type="range" name="reliable" min="1" max="5" step="1" value="3" oninput="document.getElementById('rv-reliable').textContent=this.value"></div>

<!-- 确认弹窗 -->

<!-- 公告管理弹窗 -->
<div class="mask" id="annMask">
  <div class="modal">
    <h3>公告管理</h3>
    <div class="mh">显示在展示页顶部公告栏，内容每行一条</div>
    <label>公告标题</label>
    <input id="annTitle" placeholder="如：接单必看：安全须知与交易公告">

<script src="config.js"></script>
<script>
/* ================= 基础工具 ================= */
const HEAD = () => ({ Authorization:`Bearer ${GH_TOKEN}`, Accept:"application/vnd.github+json" });
function b64(s){ return btoa(unescape(encodeURIComponent(s))); }
function unb64(b){ return decodeURIComponent(escape(atob(b))); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function toast(msg, isErr){
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast show" + (isErr ? " err" : "");
  clearTimeout(t._tm); t._tm = setTimeout(()=> t.className = "toast", isErr ? 5200 : 2600);
}

/* ================= 登录门 ================= */
function tryLogin(){
  const v = document.getElementById("pw").value;
  if(v === ADMIN_PASS){
    sessionStorage.setItem("dr_admin","1");
    document.getElementById("gate").style.display = "none";
    document.getElementById("app").style.display = "block";
    reload();
  } else {
    document.getElementById("pwBad").style.display = "block";
  }
}
function logout(){ sessionStorage.removeItem("dr_admin"); location.reload(); }
document.getElementById("pw").addEventListener("keydown", e=>{ if(e.key==="Enter") tryLogin(); });
if(sessionStorage.getItem("dr_admin") === "1"){
  document.getElementById("gate").style.display = "none";
  document.getElementById("app").style.display = "block";
}

/* ================= 数据读写（并发安全） ================= */
let DATA = [], SHA = null, SEL = new Set(), BUSY = false;
let TYPE_FILTER = "陪玩";
function setType(t){
  document.getElementById("tabOrders").classList.remove("active");
  document.getElementById("toolbar").style.display = "";
  document.getElementById("bulk").style.display = "";
  document.getElementById("list").style.display = "";
  document.getElementById("ordersView").style.display = "none";
  TYPE_FILTER = t;
  document.getElementById("tabPw").classList.toggle("active", t === "陪玩");
  document.getElementById("tabDg").classList.toggle("active", t === "代肝");
  document.getElementById("tabAll").classList.toggle("active", t === "");
  renderList();
}

async function load(){
  const r = await fetch(API_URL + "?t=" + Date.now(), { headers: HEAD() });
  if(!r.ok) throw new Error("读取数据失败 " + r.status + (r.status===401?"（令牌失效，需重新生成）":""));
  const j = await r.json();
  SHA = j.sha;
  const list = JSON.parse(unb64(j.content));
  return Array.isArray(list) ? list : [];
}

async function reload(showMsg){
  try {
    document.getElementById("list").innerHTML = '<div class="loading">加载中…</div>';
    DATA = await load();
    await loadProfit();
    SEL.clear();
    renderList();
    if(showMsg) toast("已刷新，当前陪玩/代肝 " + DATA.filter(d=>d.type==="陪玩"||d.type==="代肝").length + " 条");
  } catch(e){
    document.getElementById("list").innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
    toast(e.message, true);
  }
}

async function mutate(mutator, message){
  if(BUSY){ toast("上一个操作还在进行中，请稍候", true); return false; }
  BUSY = true;
  try {
    let lastErr = null;
    for(let i = 0; i < 3; i++){
      const fresh = await load();
      const next = JSON.parse(JSON.stringify(fresh));
      const r = mutator(next);
      if(r === false){ BUSY = false; return false; }
      try {
        const body = { message, content: b64(JSON.stringify(next, null, 2)), branch: GH_BRANCH, sha: SHA };
        const resp = await fetch(API_URL, { method:"PUT", headers:{ ...HEAD(), "Content-Type":"application/json" }, body: JSON.stringify(body) });
        if(!resp.ok){
          const ej = await resp.json().catch(()=>({}));
          throw new Error(resp.status + " " + (ej.message || ""));
        }
        const rj = await resp.json();
        SHA = rj.content.sha;
        DATA = next;
        SEL.clear(); renderList();
        BUSY = false; return true;
      } catch(e){
        lastErr = e;
        if(!/409|422|conflict|sha/i.test(e.message)) break;
      }
    }
    BUSY = false;
    throw lastErr || new Error("保存失败");
  } catch(e){
    BUSY = false;
    toast("操作失败：" + e.message, true);
    console.error(e);
    return false;
  }
}

function findIdx(list, id){ return list.findIndex(x => String(x.id) === String(id)); }

/* ================= 渲染 ================= */
function statusClass(s){ return s === "可接" ? "ok" : s === "忙碌" ? "busy" : "maint"; }
function noOf(d, i){ const n = (d.no != null && d.no !== "") ? d.no : (i+1); return String(n).padStart(3,"0"); }

function visibleList(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const fs = document.getElementById("fStatus").value;
  return DATA.map((d,i)=>({ d, seq:i+1 })).filter(({d,seq})=>{
    if(TYPE_FILTER && d.type !== TYPE_FILTER) return false;
    if(fs === "__other"){ if(d.status === "可接" || d.status === "忙碌") return false; }
    else if(fs && d.status !== fs) return false;
    if(q){
      const hay = [seq, d.no, d.id, d.type, d.name, d.games, d.platform, d.mic, d.online, d.price, d.unit, d.strong, d.note, d.status, d.tech, d.comm, d.patience, d.eff, d.fun, d.reliable]
                    .map(x=>String(x==null?"":x)).join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function renderStats(){
  const all = DATA.filter(d => d.type === "陪玩" || d.type === "代肝");
  const pw = all.filter(d=>d.type === "陪玩").length;
  const dg = all.filter(d=>d.type === "代肝").length;
  const busy = all.filter(d=>d.status === "忙碌").length;
  document.getElementById("sTotal").textContent = all.length;
  document.getElementById("sPw").textContent = pw;
  document.getElementById("sDg").textContent = dg;
  document.getElementById("sBusy").textContent = busy;
}

/* ================= 利润汇总（加价率） ================= */
let MARKUP = 0.1;
function listedPrice(base){ const m = Number(base)||0; return Math.round(m * (1 + MARKUP)); }
function profitOf(base){ return listedPrice(base) - (Number(base)||0); }

async function loadProfit(){
  try {
    const r = await fetch(PROFIT_API + "?t=" + Date.now(), { headers: HEAD() });
    if(r.ok){ const j = await r.json(); const o = JSON.parse(unb64(j.content)); if(typeof o.markup === "number") MARKUP = o.markup; return; }
  } catch(e){}
  try {
    const r = await fetch(PROFIT_RAW + "?t=" + Date.now());
    if(r.ok){ const o = await r.json(); if(typeof o.markup === "number") MARKUP = o.markup; return; }
  } catch(e){}
}

function renderProfit(){
  let base = 0, listed = 0;
  DATA.forEach(d=>{
    if(d.type === "陪玩" || d.type === "代肝"){
      base += Number(d.price)||0; listed += listedPrice(d.price);
    }
  });
  const profit = listed - base;
  document.getElementById("pBase").textContent = "￥" + Math.round(base);
  document.getElementById("pListed").textContent = "￥" + Math.round(listed);
  document.getElementById("pProfit").textContent = "￥" + Math.round(profit);
  const mi = document.getElementById("muInput");
  if(mi && document.activeElement !== mi) mi.value = Math.round(MARKUP * 1000) / 10;
}

async function saveMarkup(){
  const v = parseFloat(document.getElementById("muInput").value);
  if(isNaN(v) || v < 0){ toast("请输入有效加价率", true); return; }
  const markup = v / 100;
  const btn = document.getElementById("muSave");
  btn.disabled = true; btn.textContent = "保存中…";
  try {
    const r0 = await fetch(PROFIT_API + "?t=" + Date.now(), { headers: HEAD() });
    let sha = null;
    if(r0.ok){ const j0 = await r0.json(); sha = j0.sha; }
    else if(r0.status !== 404){ throw new Error("读取失败 " + r0.status); }
    const content = JSON.stringify({ markup }, null, 2);
    const body = { message:"更新加价率", content: b64(content), branch: GH_BRANCH };
    if(sha) body.sha = sha;
    const resp = await fetch(PROFIT_API, { method:"PUT", headers:{ ...HEAD(), "Content-Type":"application/json" }, body: JSON.stringify(body) });
    if(!resp.ok){ const ej = await resp.json().catch(()=>({})); throw new Error(resp.status + " " + (ej.message||"")); }
    MARKUP = markup;
    btn.disabled = false; btn.textContent = "保存";
    renderList();
    toast("加价率已更新为 " + v + "%");
  } catch(e){
    btn.disabled = false; btn.textContent = "保存";
    toast("保存失败：" + e.message, true);
    console.error(e);
  }
}

function renderList(){
  renderStats();
  const rows = visibleList();
  const el = document.getElementById("list");

  el.innerHTML = rows.map(({d,seq})=>{
    const id = esc(d.id);
    const typeTxt = (d.type === "陪玩" || d.type === "代肝") ? d.type : "旧·租号";
    const desc = [d.strong, d.note].filter(Boolean).join(" ｜ ");
    const isSel = SEL.has(String(d.id));
    return `
    <div class="row ${isSel?"sel":""}">
      <input class="ck" type="checkbox" ${isSel?"checked":""} onchange="toggleSel('${id}',this.checked)">
      <div class="body">
        <div class="l1">
          <span class="seq" title="编号">#${noOf(d, seq-1)}</span>
          ${d.name?`<span class="tag t-rank" style="background:#241a3a;border-color:#5e4a8a;color:#c9b3ff">${esc(d.name)}</span>`:""}
          <span class="tag t-type">${esc(typeTxt)}</span>
          <span class="badge ${statusClass(d.status)}">${esc(d.status||"—")}</span>
          <span class="tag t-price" title="接单到底价">底价 ￥${esc(d.price)}</span>
          <span class="tag t-profit" title="加价后的利润">利润 ￥${profitOf(d.price)}</span>
          ${d.platform?`<span class="tag">${esc(d.platform)}</span>`:""}
          ${d.mic?`<span class="tag">${esc(d.mic)}</span>`:""}
          ${d.online?`<span class="tag">在线 ${esc(d.online)}</span>`:""}
        </div>
        ${desc?`<div class="l2">${esc(desc)}</div>`:""}
        <div class="idtxt">id: ${id}</div>
      </div>
      <div class="acts">
        <button class="mini m-mv" title="上移" onclick="move('${id}',-1)">↑</button>
        <button class="mini m-mv" title="下移" onclick="move('${id}',1)">↓</button>
        <button class="mini m-toggle" onclick="toggleStatus('${id}')">${d.status==="可接"?"设为忙碌":"设为可接"}</button>
        <button class="mini m-edit" onclick="openEdit('${id}')">编辑</button>
        <button class="mini m-copy" onclick="copyOne('${id}')">复制</button>
        <button class="mini m-del" onclick="askDelete('${id}')">删除</button>
      </div>
    </div>`;
  }).join("");
  updateBulk();
  renderProfit();
}

/* ================= 选择 / 批量 ================= */
function toggleSel(id, on){ on ? SEL.add(String(id)) : SEL.delete(String(id)); renderList(); }
function clearSel(){ SEL.clear(); renderList(); }
function updateBulk(){
  const b = document.getElementById("bulk");
  document.getElementById("bulkN").textContent = "已选 " + SEL.size + " 条";
  b.className = "bulk" + (SEL.size ? " show" : "");
}
async function bulkStatus(st){
  const ids = [...SEL];
  if(!ids.length) return;
  const okDone = await mutate(list=>{
    let n = 0;
    ids.forEach(id=>{ const i = findIdx(list,id); if(i>=0){ list[i].status = st; n++; } });
    if(!n) throw new Error("选中的记录在最新数据中已不存在");
    return true;
  }, `批量设为${st}（${ids.length}条）`);
  if(okDone) toast(`已把 ${ids.length} 条设为「${st}」`);
}
function bulkDelete(){
  const ids = [...SEL];
  if(!ids.length) return;
  showConfirm("确认批量删除", `将永久删除选中的 <b style="color:#ff8b8b">${ids.length}</b> 条服务记录，无法撤销。<br>建议先点工具栏「⤓ 备份」导出一份。`, async ()=>{
    closeConfirm();
    const okDone = await mutate(list=>{
      const before = list.length;
      const del = new Set(ids.map(String));
      const kept = list.filter(x=>!del.has(String(x.id)));
      if(kept.length === before) throw new Error("选中的记录在最新数据中已不存在");
      list.length = 0; kept.forEach(x=>list.push(x));
      return true;
    }, `批量删除 ${ids.length} 条服务`);
    if(okDone) toast(`已删除 ${ids.length} 条`);
  });
}

/* ================= 单条操作 ================= */
async function toggleStatus(id){
  let to = "";
  const okDone = await mutate(list=>{
    const i = findIdx(list,id);
    if(i < 0) throw new Error("该记录已不存在（可能已被删除），请刷新");
    to = list[i].status === "可接" ? "忙碌" : "可接";
    list[i].status = to;
    return true;
  }, "切换服务状态");
  if(okDone) toast("已设为「" + to + "」");
}

async function move(id, dir){
  const okDone = await mutate(list=>{
    const i = findIdx(list,id);
    if(i < 0) throw new Error("该记录已不存在，请刷新");
    const j = i + dir;
    if(j < 0 || j >= list.length) return false;
    const t = list[i]; list[i] = list[j]; list[j] = t;
    return true;
  }, "调整展示顺序");
  if(okDone) toast("顺序已调整");
}

function askDelete(id){
  const d = DATA.find(x=>String(x.id)===String(id)) || {};
  const seq = DATA.findIndex(x=>String(x.id)===String(id)) + 1;
  const typeTxt = (d.type||"旧·租号");
  const priceTxt = (d.price == null ? "" : d.price);
  showConfirm("确认删除", `将永久删除 <b>#${d.no != null && d.no !== "" ? d.no : seq}</b>（${esc(typeTxt)} · ￥${esc(priceTxt)}），无法撤销。`, async ()=>{
    closeConfirm();
    const okDone = await mutate(list=>{
      const i = findIdx(list,id);
      if(i < 0) throw new Error("该记录已不存在，请刷新");
      list.splice(i,1);
      return true;
    }, "删除服务记录");
    if(okDone) toast("已删除");
  });
}

async function copyOne(id){
  const okDone = await mutate(list=>{
    const i = findIdx(list,id);
    if(i < 0) throw new Error("该记录已不存在，请刷新");
    const c = JSON.parse(JSON.stringify(list[i]));
    c.id = "U" + Date.now();
    c.status = "可接";
    const maxNo = Math.max(0, ...list.map(x=>Number(x.no)).filter(n=>!isNaN(n)));
    c.no = maxNo + 1;
    list.splice(i+1, 0, c);
    return true;
  }, "复制服务记录");
  if(okDone) toast("已复制一条，可点「编辑」修改");
}

/* ================= 新增 / 编辑 ================= */
const FIELDS = ["type","name","avatar","games","status","platform","mic","online","contact","price","unit","strong","note","tech","comm","patience","eff","fun","reliable"];
let EDIT_ID = null;

function openEdit(id){
  EDIT_ID = id;
  const f = document.getElementById("edForm");
  f.reset();
  document.getElementById("avaPrev").style.display = "none";
  if(id){
    const d = DATA.find(x=>String(x.id)===String(id)) || {};
    const seq = DATA.findIndex(x=>String(x.id)===String(id)) + 1;
    document.getElementById("edTitle").textContent = "编辑服务 #" + (d.no != null && d.no !== "" ? d.no : seq);
    document.getElementById("edSub").textContent = "id: " + id;
    FIELDS.forEach(k=>{ if(f[k]) f[k].value = (d[k] == null ? "" : d[k]); });
    // 六边形滑块：旧数据可能缺值，按 1–5 归位（默认 3）
    ["tech","comm","patience","eff","fun","reliable"].forEach(k=>{
      const n = Number(d[k]); const v = (n>=1 && n<=5) ? n : 3;
      if(f[k]) f[k].value = v;
      const lab = document.getElementById("rv-"+k); if(lab) lab.textContent = v;
    });
    if(f.status && !["可接","忙碌","维护中"].includes(d.status||"")){
      const o = document.createElement("option"); o.textContent = d.status || ""; f.status.appendChild(o); f.status.value = d.status || "";
    }
    if(d.avatar){ document.getElementById("avaPrev").style.display = "block"; document.getElementById("avaPrevImg").src = d.avatar; }
  } else {
    document.getElementById("edTitle").textContent = "新增接单";
    document.getElementById("edSub").textContent = "由管理员直接上架";
    f.status.value = "可接";
    f.type.value = (TYPE_FILTER === "代肝") ? "代肝" : "陪玩";
    ["tech","comm","patience","eff","fun","reliable"].forEach(k=>{
      if(f[k]) f[k].value = 3;
      const lab = document.getElementById("rv-"+k); if(lab) lab.textContent = 3;
    });
  }
  document.getElementById("edMask").classList.add("show");
}

// 头像：本地图片上传 → 压缩成 base64 直接存，无需图床
function onAvatarFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const max = 240;
      let w = img.width, h = img.height;
      if(w > max || h > max){ const r = Math.min(max/w, max/h); w = Math.round(w*r); h = Math.round(h*r); }
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
      cv.getContext("2d").drawImage(img, 0, 0, w, h);
      const dataUrl = cv.toDataURL("image/jpeg", 0.82);
      document.getElementById("edForm").avatar.value = dataUrl;
      document.getElementById("avaPrev").style.display = "block";
      document.getElementById("avaPrevImg").src = dataUrl;
    };
    img.onerror = () => toast("图片读取失败，请换一张", true);
    img.src = e.target.result;
  };
  reader.onerror = () => toast("文件读取失败", true);
  reader.readAsDataURL(file);
}
function closeEdit(){ document.getElementById("edMask").classList.remove("show"); EDIT_ID = null; }
// 注意：已移除"点击遮罩空白处关闭"，避免误触丢失已填信息；关闭仅限 ✕ / 取消 / 保存按钮
function requestClose(){
  const f = document.getElementById("edForm");
  const textDirty = ["name","avatar","games","platform","mic","price","online","strong","note"].some(k=> f[k] && String(f[k].value||"").trim()!=="");
  const radarDirty = ["tech","comm","patience","eff","fun","reliable"].some(k=> f[k] && Number(f[k].value)!==3);
  if(textDirty || radarDirty){
    showConfirm("放弃本次编辑？", "当前表单已填写内容，关闭后<b>不会保存</b>。确定要放弃吗？", ()=>{ closeConfirm(); closeEdit(); });
  } else {
    closeEdit();
  }
}

async function saveEdit(){
  const f = document.getElementById("edForm");
  const g = {};
  FIELDS.forEach(k=>{ if(f[k]) g[k] = String(f[k].value || "").trim(); });
  if(!g.price){ toast("价格必须填写", true); return; }
  const btn = document.getElementById("edSave");
  btn.disabled = true; btn.textContent = "保存中…";

  const patch = {
    type: g.type || "陪玩",
    name: g.name,
    avatar: g.avatar,
    games: g.games,
    status: g.status || "可接",
    contact: g.contact,
    platform: g.platform,
    mic: g.mic,
    online: g.online,
    price: Number(g.price),
    unit: g.unit || "局",
    strong: g.strong,
    note: g.note,
    tech: Number(g.tech) || 3,
    comm: Number(g.comm) || 3,
    patience: Number(g.patience) || 3,
    eff: Number(g.eff) || 3,
    fun: Number(g.fun) || 3,
    reliable: Number(g.reliable) || 3
  };
  const editing = EDIT_ID;
  const okDone = await mutate(list=>{
    if(editing){
      const i = findIdx(list, editing);
      if(i < 0) throw new Error("该记录已不存在（可能已被删除），请刷新后重试");
      Object.assign(list[i], patch);
    } else {
      const maxNo = Math.max(0, ...list.map(x=>Number(x.no)).filter(n=>!isNaN(n)));
      list.push({ id:"U"+Date.now(), no: maxNo + 1, ...patch, image:"" });
    }
    return true;
  }, editing ? "编辑服务信息" : "管理员新增接单");

  btn.disabled = false; btn.textContent = "保存";
  if(okDone){ closeEdit(); toast(editing ? "已保存修改" : "已新增接单"); }
}

function exportJson(){
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type:"application/json" });
  const a = document.createElement("a");
  const d = new Date(), p = n=>String(n).padStart(2,"0");
  a.href = URL.createObjectURL(blob);
  a.download = `accounts-backup-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast("备份文件已下载");
}

async function loadOrdersAdmin(){
  const el = document.getElementById("orderList");
  el.innerHTML = '<div class="loading">加载中…</div>';
  try {
    const r = await fetch(ORDERS_API + "?t=" + Date.now(), { headers: HEAD() });
    if(r.ok){ const j = await r.json(); __ORDERS__ = JSON.parse(unb64(j.content)); if(!Array.isArray(__ORDERS__)) __ORDERS__ = []; renderOrders(); return; }
    if(r.status === 404){ __ORDERS__ = []; renderOrders(); return; }
    throw new Error("读取失败 " + r.status);
  } catch(e){
    el.innerHTML = '<div class="empty">订单读取失败：' + esc(e.message) + '</div>';
  }
}

function memberOptions(selectedId){
  const ms = DATA.filter(d => d.type === "陪玩" || d.type === "代肝");
  let html = `<option value="">未分配</option>`;
  ms.forEach(m=>{
    const id = String(m.id);
    const sel = (id === String(selectedId)) ? " selected" : "";
    html += `<option value="${esc(id)}"${sel}>${esc(m.name||"未命名")}（${esc(m.type||"")}）</option>`;
  });
  return html;
}

async function updateOrderAt(idx, patch){
  if(idx < 0 || idx >= __ORDERS__.length) return;
  Object.assign(__ORDERS__[idx], patch);
  try {
    await saveOrdersAdmin(__ORDERS__, "更新订单分配/结算");
    renderOrders();
    toast("订单已更新");
  } catch(e){ toast("更新失败：" + e.message, true); }
}

function renderOrderSummary(){
  const list = __ORDERS__ || [];
  let rev = 0, cost = 0;
  list.forEach(o=>{ rev += Number(o.amount)||0; cost += Number(o.payout)||0; });
  const profit = rev - cost;
  const el = document.getElementById("orderSummary");
  if(!el) return;
  el.innerHTML = `本期订单 <b>${list.length}</b> 笔 ｜ 客户总付 <b style="color:#ffd24a">￥${Math.round(rev)}</b> ｜ 打手总成本 <b style="color:#5fd97a">￥${Math.round(cost)}</b> ｜ 你的利润 <b style="color:#ffd24a">￥${Math.round(profit)}</b>`;
}

function renderOrders(){
  const list = __ORDERS__ || [];
  const el = document.getElementById("orderList");
  if(!list.length){ el.innerHTML = '<div class="empty">暂无客户订单</div>'; renderOrderSummary(); return; }
  const sorted = list.map((o,i)=>({o,i})).sort((a,b)=> (b.o.createdAt||"").localeCompare(a.o.createdAt||""));
  el.innerHTML = sorted.map(({o,i})=>{
    const time = o.createdAt ? new Date(o.createdAt).toLocaleString("zh-CN") : "—";
    const amount = Number(o.amount)||0;
    const payout = Number(o.payout)||0;
    const profit = amount - payout;
    const margin = amount > 0 ? Math.round(profit/amount*100) : 0;
    const st = o.status || "待分配";
    return `
    <div class="row">
      <div class="body">
        <div class="l1">
          <span class="seq" style="background:#241a3a;border-color:#5e4a8a;color:#c9b3ff">${esc(o.type||"")}</span>
          ${o.subType?`<span class="tag t-type">${esc(o.subType)}</span>`:""}
          <span class="tag">客户：${esc(o.client||"—")}</span>
          <span class="tag">${esc(time)}</span>
          <span class="tag t-type">${esc(st)}</span>
        </div>
        <div class="l2"><b style="color:#b8c0cc;">需求：</b>${esc(o.need||"—")}</div>
        ${o.time?`<div class="l2">期望时间：${esc(o.time)}</div>`:""}
        ${o.note?`<div class="l2">备注：${esc(o.note)}</div>`:""}
        <div class="l2" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:7px;">
          <span>派给打手：
            <select onchange="updateOrderAt(${i},{assignedTo:this.value})" style="background:#0f1419;color:#e6e6e6;border:1px solid #2d3744;border-radius:6px;padding:5px 7px;font-size:12px;">${memberOptions(o.assignedTo)}</select>
          </span>
          <span>客户付￥<input type="number" min="0" value="${amount}" onchange="updateOrderAt(${i},{amount:Number(this.value)||0})" style="width:82px;background:#0f1419;color:#ffd24a;border:1px solid #2d3744;border-radius:6px;padding:5px 7px;font-size:12px;"></span>
          <span>给打手￥<input type="number" min="0" value="${payout}" onchange="updateOrderAt(${i},{payout:Number(this.value)||0})" style="width:82px;background:#0f1419;color:#5fd97a;border:1px solid #2d3744;border-radius:6px;padding:5px 7px;font-size:12px;"></span>
          <span style="color:#ffd24a;font-weight:700;">利润 ￥${profit}${amount>0?` (${margin}%)`:""}</span>
          <span>状态：
            <select onchange="updateOrderAt(${i},{status:this.value})" style="background:#0f1419;color:#e6e6e6;border:1px solid #2d3744;border-radius:6px;padding:5px 7px;font-size:12px;">
              <option value="待分配"${st==="待分配"?" selected":""}>待分配</option>
              <option value="已派单"${st==="已派单"?" selected":""}>已派单</option>
              <option value="已完成"${st==="已完成"?" selected":""}>已完成</option>
            </select>
          </span>
        </div>
        <div class="idtxt">订单索引：#${i}</div>
      </div>
      <div class="acts">
        <button class="mini m-del" onclick="delOrder(${i})">删除</button>
      </div>
    </div>`;
  }).join("");
  renderOrderSummary();
}

async function saveOrdersAdmin(list, message){
  let sha = null;
  const r0 = await fetch(ORDERS_API + "?t=" + Date.now(), { headers: HEAD() });
  if(r0.ok){ const j0 = await r0.json(); sha = j0.sha; }
  else if(r0.status !== 404){ throw new Error("读取失败 " + r0.status); }
  const body = { message, content: b64(JSON.stringify(list, null, 2)), branch: GH_BRANCH };
  if(sha) body.sha = sha;
  const resp = await fetch(ORDERS_API, { method:"PUT", headers:{ ...HEAD(), "Content-Type":"application/json" }, body: JSON.stringify(body) });
  if(!resp.ok){ const ej = await resp.json().catch(()=>({})); throw new Error(resp.status + " " + (ej.message||"")); }
  return true;
}

function delOrder(idx){
  if(idx<0 || idx>=__ORDERS__.length) return;
  showConfirm("确认删除订单", "将永久删除这条客户订单，无法撤销。", async ()=>{
    closeConfirm();
    try {
      __ORDERS__.splice(idx, 1);
      await saveOrdersAdmin(__ORDERS__, "删除客户订单");
      renderOrders();
      toast("已删除该订单");
    } catch(e){ toast("删除失败：" + e.message, true); }
  });
}

function clearOrders(){
  showConfirm("确认清空全部订单", "将<b>永久删除所有</b>客户订单记录，无法撤销。", async ()=>{
    closeConfirm();
    try {
      __ORDERS__ = [];
      await saveOrdersAdmin([], "清空客户订单");
      renderOrders();
      toast("已清空所有订单");
    } catch(e){ toast("清空失败：" + e.message, true); }
  });
}

/* 启动 */
if(sessionStorage.getItem("dr_admin") === "1") reload();
</script>
