<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账号管理后台 · 三角洲租号</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#0f1419; color:#e6e6e6; }
  .wrap { max-width:1100px; margin:0 auto; padding:16px 14px 40px; }

  header { display:flex; justify-content:space-between; align-items:center; padding:14px 0; flex-wrap:wrap; gap:10px; }
  header h1 { font-size:19px; color:#ffd24a; }
  header .sub { font-size:12px; color:#8a94a6; margin-top:4px; }
  .headlinks a { font-size:12px; color:#6fd3e8; text-decoration:none; margin-left:12px; }

  /* 统计 */
  .stats { display:flex; gap:10px; margin:8px 0 14px; flex-wrap:wrap; }
  .stat { flex:1; min-width:100px; background:#1a212b; border:1px solid #2d3744; border-radius:10px; padding:11px 12px; }
  .stat .l { font-size:11px; color:#8a94a6; }
  .stat .v { font-size:21px; font-weight:800; color:#ffd24a; margin-top:3px; }
  .stat.g .v { color:#5fd97a; } .stat.o .v { color:#ffb24a; }

  /* 利润汇总 */
  .profit-box { background:#1a212b; border:1px solid #5e4a18; border-radius:11px; padding:12px 14px; margin:12px 0; }
  .pb-head { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .pb-title { font-size:15px; font-weight:800; color:#ffd24a; }
  .pb-mu { font-size:12px; color:#b8c0cc; display:flex; align-items:center; gap:6px; }
  .pb-mu input { width:64px; background:#0f1419; color:#e6e6e6; border:1px solid #2d3744; border-radius:7px; padding:7px 8px; font-size:13px; }
  .pb-stats { display:flex; gap:10px; flex-wrap:wrap; }
  .pb-stats .stat { flex:1; min-width:100px; }
  .t-profit { background:#2d220b; border-color:#5e4a18; color:#ffd24a; font-weight:800; }

  /* 工具栏 */
  .bar { display:flex; gap:9px; background:#1a212b; padding:12px; border-radius:11px; flex-wrap:wrap; align-items:center; }
  .bar input, .bar select { background:#0f1419; color:#e6e6e6; border:1px solid #2d3744; border-radius:8px; padding:9px 10px; font-size:13px; min-width:110px; }
  .bar input.search { flex:1; min-width:150px; }
  .btn { border:none; border-radius:8px; padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .btn-y { background:#ffd24a; color:#0f1419; }
  .btn-b { background:#2d6cdf; color:#fff; }
  .btn-g { background:#1f5a35; color:#5fd97a; }
  .btn-r { background:#5a1f24; color:#ff8b8b; }
  .btn-d { background:#2d3744; color:#e6e6e6; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }

  /* 批量操作条 */
  .bulk { display:none; align-items:center; gap:9px; background:#22303f; border:1px solid #2d6cdf; padding:10px 12px; border-radius:10px; margin-top:10px; flex-wrap:wrap; }
  .bulk.show { display:flex; }
  .bulk .n { font-size:13px; color:#6fd3e8; font-weight:700; }

  /* 列表 */
  .list { margin-top:14px; display:flex; flex-direction:column; gap:9px; }
  .row { background:#1a212b; border:1px solid #2d3744; border-radius:11px; padding:11px 12px; display:flex; gap:11px; align-items:flex-start; }
  .row.sel { border-color:#2d6cdf; background:#1b2430; }
  .row .ck { margin-top:3px; width:17px; height:17px; flex-shrink:0; accent-color:#2d6cdf; cursor:pointer; }
  .row .body { flex:1; min-width:0; }
  .row .l1 { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .seq { font-size:13px; font-weight:800; color:#fff; background:#0f1419; border:1px solid #2d3744; border-radius:6px; padding:2px 7px; }
  .tag { font-size:11.5px; padding:3px 8px; border-radius:6px; background:#0f1419; border:1px solid #2d3744; color:#b8c0cc; }
  .t-rank { background:#2a2410; border-color:#5e4a18; color:#ffd24a; font-weight:700; }
  .t-lv { background:#0c2630; border-color:#1f4a5a; color:#6fd3e8; font-weight:700; }
  .t-q { background:#3a1416; border-color:#7a2a2e; color:#ff6b6b; }
  .t-v { background:#0f2e1a; border-color:#1f5a35; color:#5fd97a; }
  .t-price { background:#2a2410; border-color:#5e4a18; color:#ffd24a; font-weight:800; }
  .badge { font-size:11px; padding:3px 9px; border-radius:20px; font-weight:600; }
  .ok { background:#16351f; color:#5fd97a; }
  .busy { background:#3a2a12; color:#ffb24a; }
  .maint { background:#2d2d2d; color:#aaa; }
  .row .l2 { font-size:11.5px; color:#8a94a6; margin-top:6px; line-height:1.5; word-break:break-word; }
  .row .idtxt { font-size:10.5px; color:#5a6474; margin-top:5px; }
  .row .acts { display:flex; gap:5px; flex-shrink:0; flex-wrap:wrap; justify-content:flex-end; max-width:210px; }
  .mini { border:none; border-radius:7px; padding:6px 9px; font-size:12px; cursor:pointer; font-weight:600; }
  .m-toggle { background:#2d3744; color:#ffd24a; }
  .m-edit { background:#2d6cdf; color:#fff; }
  .m-copy { background:#2d3744; color:#b8c0cc; }
  .m-del { background:#5a1f24; color:#ff8b8b; }
  .m-mv { background:#22303f; color:#8a94a6; padding:6px 8px; }
  @media (max-width:640px){
    .row { flex-wrap:wrap; }
    .row .acts { max-width:none; width:100%; justify-content:flex-start; border-top:1px solid #2d3744; padding-top:9px; margin-top:4px; }
  }

  .empty, .loading { text-align:center; color:#8a94a6; padding:36px 0; font-size:14px; }

  /* 提示条 */
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:26px; background:#16351f; color:#5fd97a; border:1px solid #1f5a35; padding:12px 20px; border-radius:10px; font-size:14px; z-index:60; display:none; box-shadow:0 6px 20px rgba(0,0,0,.5); max-width:90%; text-align:center; }
  .toast.err { background:#3a1416; color:#ff8b8b; border-color:#7a2a2e; }
  .toast.show { display:block; }

  /* 遮罩/弹窗 */
  .mask { position:fixed; inset:0; background:rgba(0,0,0,.72); display:none; align-items:center; justify-content:center; z-index:50; padding:16px; overflow-y:auto; }
  .mask.show { display:flex; }
  .modal { background:#1a212b; border:1px solid #2d3744; border-radius:14px; padding:20px; width:100%; max-width:520px; margin:auto; }
  .modal h3 { color:#ffd24a; font-size:17px; margin-bottom:6px; text-align:center; }
  .modal .mh { font-size:11.5px; color:#8a94a6; text-align:center; margin-bottom:12px; }
  .modal label { display:block; font-size:12px; color:#b8c0cc; margin:11px 0 4px; }
  .modal label .req { color:#ff6b6b; }
  .modal input, .modal select, .modal textarea { width:100%; background:#0f1419; color:#e6e6e6; border:1px solid #2d3744; border-radius:8px; padding:10px; font-size:14px; }
  .modal textarea { resize:vertical; min-height:54px; }
  .frow { display:flex; gap:10px; } .frow > div { flex:1; }
  @media (max-width:520px){ .frow { flex-wrap:wrap; } .frow > div { min-width:calc(50% - 5px); } }
  .modal .foot { display:flex; gap:10px; margin-top:18px; }
  .modal .foot .btn { flex:1; padding:12px; font-size:14px; }

  /* 登录门 */
  #gate { position:fixed; inset:0; background:#0f1419; display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; }
  #gate .box { background:#1a212b; border:1px solid #2d3744; border-radius:14px; padding:26px 22px; width:100%; max-width:330px; text-align:center; }
  #gate h2 { color:#ffd24a; font-size:18px; margin-bottom:6px; }
  #gate p { font-size:12px; color:#8a94a6; margin-bottom:16px; }
  #gate input { width:100%; background:#0f1419; color:#e6e6e6; border:1px solid #2d3744; border-radius:8px; padding:12px; font-size:15px; text-align:center; }
  #gate button { width:100%; margin-top:12px; background:#ffd24a; color:#0f1419; border:none; border-radius:9px; padding:12px; font-size:15px; font-weight:700; cursor:pointer; }
  #gate .bad { color:#ff6b6b; font-size:12.5px; margin-top:10px; display:none; }
</style>
</head>
<body>

<!-- 登录门 -->
<div id="gate">
  <div class="box">
    <h2>🔐 管理后台</h2>
    <p>请输入管理密码</p>
    <input id="pw" type="password" placeholder="管理密码" autocomplete="current-password">
    <button onclick="tryLogin()">进入管理</button>
    <div class="bad" id="pwBad">密码不对，再试一次</div>
  </div>
</div>

<div class="wrap" id="app" style="display:none;">
  <header>
    <div>
      <h1>账号管理后台</h1>
      <div class="sub">所有改动直接写入 GitHub 数据文件，租号页几十秒内同步</div>
    </div>
    <div class="headlinks">
      <a href="gh-index.html" target="_blank">↗ 打开租号展示页</a>
      <a href="#" onclick="logout();return false;">退出</a>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><div class="l">总账号</div><div class="v" id="sTotal">—</div></div>
    <div class="stat g"><div class="l">可租</div><div class="v" id="sOk">—</div></div>
    <div class="stat o"><div class="l">已租</div><div class="v" id="sBusy">—</div></div>
    <div class="stat"><div class="l">其他/维护</div><div class="v" id="sOther">—</div></div>
  </div>

  <div class="profit-box" id="profitBox">
    <div class="pb-head">
      <span class="pb-title">💰 利润汇总（按加价率自动算）</span>
      <span class="pb-mu">加价率 <input id="muInput" type="number" step="0.5" min="0" placeholder="10"> % <button class="btn btn-y" id="muSave" onclick="saveMarkup()">保存</button></span>
    </div>
    <div class="pb-stats">
      <div class="stat"><div class="l">总底价</div><div class="v" id="pBase">—</div></div>
      <div class="stat g"><div class="l">总营收(上架价)</div><div class="v" id="pListed">—</div></div>
      <div class="stat o"><div class="l">总利润</div><div class="v" id="pProfit">—</div></div>
    </div>
  </div>

  <div class="bar">
    <input class="search" id="q" type="text" placeholder="搜索：段位 / 卖点 / 管理 / 编号…" oninput="renderList()">
    <select id="fStatus" onchange="renderList()">
      <option value="">全部状态</option><option>可租</option><option>已租</option><option value="__other">其他/维护</option>
    </select>
    <select id="fRank" onchange="renderList()">
      <option value="">全部段位</option><option>青铜</option><option>白银</option><option>黄金</option>
      <option>铂金</option><option>钻石</option><option>黑鹰</option><option>三角洲巅峰</option><option value="__none">未标段位</option>
    </select>
    <button class="btn btn-y" onclick="openEdit(null)">＋ 新增账号</button>
    <button class="btn btn-d" onclick="reload(true)">↻ 刷新</button>
    <button class="btn btn-d" onclick="exportJson()">⤓ 备份</button>
    <button class="btn btn-d" onclick="openAnn()">📢 公告管理</button>
  </div>

  <div class="bulk" id="bulk">
    <span class="n" id="bulkN">已选 0 条</span>
    <button class="btn btn-g" onclick="bulkStatus('可租')">批量设为可租</button>
    <button class="btn btn-b" onclick="bulkStatus('已租')">批量设为已租</button>
    <button class="btn btn-r" onclick="bulkDelete()">批量删除</button>
    <button class="btn btn-d" onclick="clearSel()">取消选择</button>
  </div>

  <div class="list" id="list"><div class="loading">加载中…</div></div>
</div>

<!-- 编辑/新增弹窗 -->
<div class="mask" id="edMask">
  <div class="modal">
    <h3 id="edTitle">编辑账号</h3>
    <div class="mh" id="edSub"></div>
    <form id="edForm" onsubmit="return false;">
      <div class="frow">
        <div>
          <label>段位</label>
          <input name="rank" list="rankList" placeholder="如 铂金 / 钻石 II（留空=不标注）">
          <datalist id="rankList">
            <option>青铜</option><option>白银</option><option>黄金</option><option>铂金</option>
            <option>钻石</option><option>黑鹰</option><option>三角洲巅峰</option>
          </datalist>
        </div>
        <div>
          <label>状态 <span class="req">*</span></label>
          <select name="status"><option>可租</option><option>已租</option><option>维护中</option></select>
        </div>
      </div>
      <div class="frow">
        <div><label>等级</label><input name="level" placeholder="如 60级"></div>
        <div>
          <label>区服</label>
          <input name="zone" list="zoneList" placeholder="Q区 / V区">
          <datalist id="zoneList"><option>Q区</option><option>V区</option></datalist>
        </div>
      </div>
      <div class="frow">
        <div><label>租金(元) <span class="req">*</span></label><input name="price" type="number" placeholder="30"></div>
        <div><label>押金(元)</label><input name="deposit" type="number" placeholder="200"></div>
      </div>
      <div class="frow">
        <div><label>纯币</label><input name="coin" placeholder="如 50M"></div>
        <div><label>保险</label><input name="insurance" placeholder="如 8"></div>
      </div>
      <div class="frow">
        <div><label>比例</label><input name="ratio" placeholder="如 1:29"></div>
        <div><label>体力</label><input name="ti" placeholder="如 7"></div>
        <div><label>负重</label><input name="fu" placeholder="如 6"></div>
      </div>
      <label>角色皮肤 / 刀皮 / AW子弹数量</label>
      <textarea name="gear" placeholder="如 角色皮肤：暗影 / 刀皮：热能 / AW子弹：320发"></textarea>
      <label>备注</label>
      <textarea name="note" placeholder="租期要求、扣押金规则等"></textarea>
      <label>添加管理员并备注 上架账号的编号</label>
      <input name="admin" placeholder="如 管理员：张三，本号上架编号见卡片 #">
      <div class="foot">
        <button class="btn btn-y" id="edSave" onclick="saveEdit()">保存</button>
        <button class="btn btn-d" onclick="closeEdit()">取消</button>
      </div>
    </form>
  </div>
</div>

<!-- 确认弹窗 -->
<div class="mask" id="cfMask">
  <div class="modal" style="max-width:380px;">
    <h3 id="cfTitle">确认操作</h3>
    <div class="mh" id="cfBody" style="font-size:13px; color:#b8c0cc; line-height:1.6; margin-bottom:4px;"></div>
    <div class="foot">
      <button class="btn btn-r" id="cfOk">确认删除</button>
      <button class="btn btn-d" onclick="closeConfirm()">取消</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 公告管理弹窗 -->
<div class="mask" id="annMask">
  <div class="modal">
    <h3>公告管理</h3>
    <div class="mh">显示在租号展示页顶部公告栏，内容每行一条</div>
    <label>公告标题</label>
    <input id="annTitle" placeholder="如：租号必看：安全须知与交易公告">
    <label>公告内容（每行一条）</label>
    <textarea id="annBody" style="min-height:210px;" placeholder="第一行内容&#10;第二行内容"></textarea>
    <div class="foot">
      <button class="btn btn-y" id="annSave" onclick="saveAnn()">保存</button>
      <button class="btn btn-d" onclick="closeAnn()">取消</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
/* ================= 基础工具 ================= */
const HEAD = () => ({ Authorization:`Bearer ${GH_TOKEN}`, Accept:"application/vnd.github+json" });
function b64(s){ return btoa(unescape(encodeURIComponent(s))); }
function unb64(b){ return decodeURIComponent(escape(atob(b))); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function toast(msg, isErr){
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast show" + (isErr ? " err" : "");
  clearTimeout(t._tm); t._tm = setTimeout(()=> t.className = "toast", isErr ? 5200 : 2600);
}

/* ================= 登录门 ================= */
function tryLogin(){
  const v = document.getElementById("pw").value;
  if(v === ADMIN_PASS){
    sessionStorage.setItem("dr_admin","1");
    document.getElementById("gate").style.display = "none";
    document.getElementById("app").style.display = "block";
    reload();
  } else {
    document.getElementById("pwBad").style.display = "block";
  }
}
function logout(){ sessionStorage.removeItem("dr_admin"); location.reload(); }
document.getElementById("pw").addEventListener("keydown", e=>{ if(e.key==="Enter") tryLogin(); });
if(sessionStorage.getItem("dr_admin") === "1"){
  document.getElementById("gate").style.display = "none";
  document.getElementById("app").style.display = "block";
}

/* ================= 数据读写（并发安全） ================= */
let DATA = [], SHA = null, SEL = new Set(), BUSY = false;

async function load(){
  const r = await fetch(API_URL + "?t=" + Date.now(), { headers: HEAD() });
  if(!r.ok) throw new Error("读取数据失败 " + r.status + (r.status===401?"（令牌失效，需重新生成）":""));
  const j = await r.json();
  SHA = j.sha;
  const list = JSON.parse(unb64(j.content));
  return Array.isArray(list) ? list : [];
}

async function reload(showMsg){
  try {
    document.getElementById("list").innerHTML = '<div class="loading">加载中…</div>';
    DATA = await load();
    await loadProfit();
    SEL.clear();
    renderList();
    if(showMsg) toast("已刷新，当前 " + DATA.length + " 条");
  } catch(e){
    document.getElementById("list").innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
    toast(e.message, true);
  }
}

/* 核心：所有写操作都走这里。
   每次都重新拉最新数据再改，按唯一 id 定位，sha 冲突自动重试。
   这样即使号主此刻正在提交新账号，也不会被管理端覆盖掉。 */
async function mutate(mutator, message){
  if(BUSY){ toast("上一个操作还在进行中，请稍候", true); return false; }
  BUSY = true;
  try {
    let lastErr = null;
    for(let i = 0; i < 3; i++){
      const fresh = await load();                       // 1. 拉最新
      const next = JSON.parse(JSON.stringify(fresh));
      const r = mutator(next);                          // 2. 在最新数据上改
      if(r === false){ BUSY = false; return false; }
      try {
        const body = { message, content: b64(JSON.stringify(next, null, 2)), branch: GH_BRANCH, sha: SHA };
        const resp = await fetch(API_URL, { method:"PUT", headers:{ ...HEAD(), "Content-Type":"application/json" }, body: JSON.stringify(body) });
        if(!resp.ok){
          const ej = await resp.json().catch(()=>({}));
          throw new Error(resp.status + " " + (ej.message || ""));
        }
        const rj = await resp.json();
        SHA = rj.content.sha;
        DATA = next;                                    // 3. 成功后同步本地
        SEL.clear(); renderList();
        BUSY = false; return true;
      } catch(e){
        lastErr = e;
        if(!/409|422|conflict|sha/i.test(e.message)) break;  // 非冲突错误不重试
      }
    }
    BUSY = false;
    throw lastErr || new Error("保存失败");
  } catch(e){
    BUSY = false;
    toast("操作失败：" + e.message, true);
    console.error(e);
    return false;
  }
}

function findIdx(list, id){ return list.findIndex(x => String(x.id) === String(id)); }

/* ================= 渲染 ================= */
function statusClass(s){ return s === "可租" ? "ok" : s === "已租" ? "busy" : "maint"; }
function noOf(d, i){ const n = (d.no != null && d.no !== "") ? d.no : (i+1); return String(n).padStart(3,"0"); }

function visibleList(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const fs = document.getElementById("fStatus").value;
  const fr = document.getElementById("fRank").value;
  return DATA.map((d,i)=>({ d, seq:i+1 })).filter(({d,seq})=>{
    if(fs === "__other"){ if(d.status === "可租" || d.status === "已租") return false; }
    else if(fs && d.status !== fs) return false;
    if(fr === "__none"){ if((d.rank||"").trim()) return false; }
    else if(fr && !(d.rank||"").includes(fr)) return false;
    if(q){
      const hay = [seq, d.no, d.id, d.rank, d.level, d.zone, d.price, d.coin, d.gear, d.note, d.admin, d.status]
                    .map(x=>String(x==null?"":x)).join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function renderStats(){
  const t = DATA.length;
  const ok = DATA.filter(d=>d.status==="可租").length;
  const bs = DATA.filter(d=>d.status==="已租").length;
  document.getElementById("sTotal").textContent = t;
  document.getElementById("sOk").textContent = ok;
  document.getElementById("sBusy").textContent = bs;
  document.getElementById("sOther").textContent = t - ok - bs;
}

/* ================= 利润汇总（加价率） ================= */
let MARKUP = 0.1;
function listedPrice(base){ const m = Number(base)||0; return Math.round(m * (1 + MARKUP)); }
function profitOf(base){ return listedPrice(base) - (Number(base)||0); }

async function loadProfit(){
  try {
    const r = await fetch(PROFIT_API + "?t=" + Date.now(), { headers: HEAD() });
    if(r.ok){ const j = await r.json(); const o = JSON.parse(unb64(j.content)); if(typeof o.markup === "number") MARKUP = o.markup; return; }
  } catch(e){}
  try {
    const r = await fetch(PROFIT_RAW + "?t=" + Date.now());
    if(r.ok){ const o = await r.json(); if(typeof o.markup === "number") MARKUP = o.markup; return; }
  } catch(e){}
}

function renderProfit(){
  let base = 0, listed = 0;
  DATA.forEach(d=>{ base += Number(d.price)||0; listed += listedPrice(d.price); });
  const profit = listed - base;
  document.getElementById("pBase").textContent = "￥" + Math.round(base);
  document.getElementById("pListed").textContent = "￥" + Math.round(listed);
  document.getElementById("pProfit").textContent = "￥" + Math.round(profit);
  const mi = document.getElementById("muInput");
  if(mi && document.activeElement !== mi) mi.value = Math.round(MARKUP * 1000) / 10;
}

async function saveMarkup(){
  const v = parseFloat(document.getElementById("muInput").value);
  if(isNaN(v) || v < 0){ toast("请输入有效加价率", true); return; }
  const markup = v / 100;
  const btn = document.getElementById("muSave");
  btn.disabled = true; btn.textContent = "保存中…";
  try {
    const r0 = await fetch(PROFIT_API + "?t=" + Date.now(), { headers: HEAD() });
    let sha = null;
    if(r0.ok){ const j0 = await r0.json(); sha = j0.sha; }
    else if(r0.status !== 404){ throw new Error("读取失败 " + r0.status); }
    const content = JSON.stringify({ markup }, null, 2);
    const body = { message:"更新加价率", content: b64(content), branch: GH_BRANCH };
    if(sha) body.sha = sha;
    const resp = await fetch(PROFIT_API, { method:"PUT", headers:{ ...HEAD(), "Content-Type":"application/json" }, body: JSON.stringify(body) });
    if(!resp.ok){ const ej = await resp.json().catch(()=>({})); throw new Error(resp.status + " " + (ej.message||"")); }
    MARKUP = markup;
    btn.disabled = false; btn.textContent = "保存";
    renderList();
    toast("加价率已更新为 " + v + "%");
  } catch(e){
    btn.disabled = false; btn.textContent = "保存";
    toast("保存失败：" + e.message, true);
    console.error(e);
  }
}

function renderList(){
  renderStats();
  const rows = visibleList();
  const el = document.getElementById("list");
  if(!rows.length){ el.innerHTML = '<div class="empty">没有符合条件的账号</div>'; updateBulk(); return; }
  el.innerHTML = rows.map(({d,seq})=>{
    const id = esc(d.id);
    const zoneCls = d.zone === "Q区" ? "t-q" : d.zone === "V区" ? "t-v" : "";
    const tf = [d.ti?("体"+d.ti):"", d.fu?("负"+d.fu):""].filter(Boolean).join(" ");
    const desc = [d.gear, d.note].filter(Boolean).join(" ｜ ");
    const isSel = SEL.has(String(d.id));
    return `
    <div class="row ${isSel?"sel":""}">
      <input class="ck" type="checkbox" ${isSel?"checked":""} onchange="toggleSel('${id}',this.checked)">
      <div class="body">
        <div class="l1">
          <span class="seq" title="账号编号">#${noOf(d, seq-1)}</span>
          <span class="badge ${statusClass(d.status)}">${esc(d.status||"—")}</span>
          <span class="tag t-price" title="号主底价">底价 ￥${esc(d.price)}</span>
          <span class="tag t-profit" title="加价后的利润">利润 ￥${profitOf(d.price)}</span>
          ${d.deposit?`<span class="tag">押金 ${esc(d.deposit)}</span>`:""}
          ${(d.rank||"").trim()?`<span class="tag t-rank">${esc(d.rank)}</span>`:`<span class="tag">未标段位</span>`}
          ${d.level?`<span class="tag t-lv">${esc(d.level)}</span>`:""}
          ${d.zone?`<span class="tag ${zoneCls}">${esc(d.zone)}</span>`:""}
          ${d.coin?`<span class="tag">纯币 ${esc(d.coin)}</span>`:""}
          ${d.insurance?`<span class="tag">保险 ${esc(d.insurance)}</span>`:""}
          ${d.ratio?`<span class="tag">比例 ${esc(d.ratio)}</span>`:""}
          ${tf?`<span class="tag">${esc(tf)}</span>`:""}
          ${d.admin?`<span class="tag">管理 ${esc(d.admin)}</span>`:""}
        </div>
        ${desc?`<div class="l2">${esc(desc)}</div>`:""}
        <div class="idtxt">id: ${id}</div>
      </div>
      <div class="acts">
        <button class="mini m-mv" title="上移" onclick="move('${id}',-1)">↑</button>
        <button class="mini m-mv" title="下移" onclick="move('${id}',1)">↓</button>
        <button class="mini m-toggle" onclick="toggleStatus('${id}')">${d.status==="可租"?"设为已租":"设为可租"}</button>
        <button class="mini m-edit" onclick="openEdit('${id}')">编辑</button>
        <button class="mini m-copy" onclick="copyOne('${id}')">复制</button>
        <button class="mini m-del" onclick="askDelete('${id}')">删除</button>
      </div>
    </div>`;
  }).join("");
  updateBulk();
  renderProfit();
}

/* ================= 选择 / 批量 ================= */
function toggleSel(id, on){ on ? SEL.add(String(id)) : SEL.delete(String(id)); renderList(); }
function clearSel(){ SEL.clear(); renderList(); }
function updateBulk(){
  const b = document.getElementById("bulk");
  document.getElementById("bulkN").textContent = "已选 " + SEL.size + " 条";
  b.className = "bulk" + (SEL.size ? " show" : "");
}
async function bulkStatus(st){
  const ids = [...SEL];
  if(!ids.length) return;
  const okDone = await mutate(list=>{
    let n = 0;
    ids.forEach(id=>{ const i = findIdx(list,id); if(i>=0){ list[i].status = st; n++; } });
    if(!n) throw new Error("选中的记录在最新数据中已不存在");
    return true;
  }, `批量设为${st}（${ids.length}条）`);
  if(okDone) toast(`已把 ${ids.length} 条设为「${st}」`);
}
function bulkDelete(){
  const ids = [...SEL];
  if(!ids.length) return;
  showConfirm("确认批量删除", `将永久删除选中的 <b style="color:#ff8b8b">${ids.length}</b> 条账号，无法撤销。<br>建议先点工具栏「⤓ 备份」导出一份。`, async ()=>{
    closeConfirm();
    const okDone = await mutate(list=>{
      const before = list.length;
      const del = new Set(ids.map(String));
      const kept = list.filter(x=>!del.has(String(x.id)));
      if(kept.length === before) throw new Error("选中的记录在最新数据中已不存在");
      list.length = 0; kept.forEach(x=>list.push(x));
      return true;
    }, `批量删除 ${ids.length} 条账号`);
    if(okDone) toast(`已删除 ${ids.length} 条`);
  });
}

/* ================= 单条操作 ================= */
async function toggleStatus(id){
  let to = "";
  const okDone = await mutate(list=>{
    const i = findIdx(list,id);
    if(i < 0) throw new Error("该记录已不存在（可能已被删除），请刷新");
    to = list[i].status === "可租" ? "已租" : "可租";
    list[i].status = to;
    return true;
  }, "切换账号状态");
  if(okDone) toast("已设为「" + to + "」");
}

async function move(id, dir){
  const okDone = await mutate(list=>{
    const i = findIdx(list,id);
    if(i < 0) throw new Error("该记录已不存在，请刷新");
    const j = i + dir;
    if(j < 0 || j >= list.length) return false;   // 已在顶/底，不提交
    const t = list[i]; list[i] = list[j]; list[j] = t;
    return true;
  }, "调整账号展示顺序");
  if(okDone) toast("顺序已调整");
}

function askDelete(id){
  const d = DATA.find(x=>String(x.id)===String(id)) || {};
  const seq = DATA.findIndex(x=>String(x.id)===String(id)) + 1;
  const rankTxt = (d.rank || "").trim() || "未标段位";
  const priceTxt = (d.price == null ? "" : d.price);
  showConfirm("确认删除", `将永久删除 <b>#${d.no != null && d.no !== "" ? d.no : seq}</b>（${esc(rankTxt)} · ￥${esc(priceTxt)}），无法撤销。`, async ()=>{
    closeConfirm();
    const okDone = await mutate(list=>{
      const i = findIdx(list,id);
      if(i < 0) throw new Error("该记录已不存在，请刷新");
      list.splice(i,1);
      return true;
    }, "删除账号");
    if(okDone) toast("已删除");
  });
}

async function copyOne(id){
  const okDone = await mutate(list=>{
    const i = findIdx(list,id);
    if(i < 0) throw new Error("该记录已不存在，请刷新");
    const c = JSON.parse(JSON.stringify(list[i]));
    c.id = "U" + Date.now();
    c.status = "可租";
    const maxNo = Math.max(0, ...list.map(x=>Number(x.no)).filter(n=>!isNaN(n)));
    c.no = maxNo + 1;
    list.splice(i+1, 0, c);
    return true;
  }, "复制账号");
  if(okDone) toast("已复制一条，可点「编辑」修改");
}

/* ================= 新增 / 编辑 ================= */
const FIELDS = ["rank","status","level","zone","price","deposit","coin","insurance","ratio","ti","fu","gear","note","admin"];
let EDIT_ID = null;

function openEdit(id){
  EDIT_ID = id;
  const f = document.getElementById("edForm");
  f.reset();
  if(id){
    const d = DATA.find(x=>String(x.id)===String(id)) || {};
    const seq = DATA.findIndex(x=>String(x.id)===String(id)) + 1;
    document.getElementById("edTitle").textContent = "编辑账号 #" + (d.no != null && d.no !== "" ? d.no : seq);
    document.getElementById("edSub").textContent = "id: " + id;
    FIELDS.forEach(k=>{ if(f[k]) f[k].value = (d[k] == null ? "" : d[k]); });
    if(f.status && !["可租","已租","维护中"].includes(d.status||"")){
      const o = document.createElement("option"); o.textContent = d.status || ""; f.status.appendChild(o); f.status.value = d.status || "";
    }
  } else {
    document.getElementById("edTitle").textContent = "新增账号";
    document.getElementById("edSub").textContent = "由管理员直接上架";
    f.status.value = "可租";
  }
  document.getElementById("edMask").classList.add("show");
}
function closeEdit(){ document.getElementById("edMask").classList.remove("show"); EDIT_ID = null; }
document.getElementById("edMask").addEventListener("click", e=>{ if(e.target.id==="edMask") closeEdit(); });

async function saveEdit(){
  const f = document.getElementById("edForm");
  const g = {};
  FIELDS.forEach(k=>{ if(f[k]) g[k] = String(f[k].value || "").trim(); });
  if(!g.price){ toast("租金必须填写", true); return; }
  const btn = document.getElementById("edSave");
  btn.disabled = true; btn.textContent = "保存中…";

  const patch = {
    rank:g.rank, status:g.status || "可租", level:g.level, zone:g.zone,
    price:Number(g.price), deposit:g.deposit ? Number(g.deposit) : "",
    coin:g.coin, insurance:g.insurance, ratio:g.ratio, ti:g.ti, fu:g.fu,
    gear:g.gear, note:g.note, admin:g.admin
  };
  const editing = EDIT_ID;
  const okDone = await mutate(list=>{
    if(editing){
      const i = findIdx(list, editing);
      if(i < 0) throw new Error("该记录已不存在（可能已被删除），请刷新后重试");
      Object.assign(list[i], patch);
    } else {
      const maxNo = Math.max(0, ...list.map(x=>Number(x.no)).filter(n=>!isNaN(n)));
      list.push({ id:"U"+Date.now(), no: maxNo + 1, ...patch, image:"" });
    }
    return true;
  }, editing ? "编辑账号信息" : "管理员新增账号");

  btn.disabled = false; btn.textContent = "保存";
  if(okDone){ closeEdit(); toast(editing ? "已保存修改" : "已新增账号"); }
}

/* ================= 确认弹窗 ================= */
function showConfirm(title, html, onOk){
  document.getElementById("cfTitle").textContent = title;
  document.getElementById("cfBody").innerHTML = html;
  const b = document.getElementById("cfOk");
  b.onclick = onOk;
  document.getElementById("cfMask").classList.add("show");
}
function closeConfirm(){ document.getElementById("cfMask").classList.remove("show"); }
document.getElementById("cfMask").addEventListener("click", e=>{ if(e.target.id==="cfMask") closeConfirm(); });

/* ================= 备份导出 ================= */
function exportJson(){
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type:"application/json" });
  const a = document.createElement("a");
  const d = new Date(), p = n=>String(n).padStart(2,"0");
  a.href = URL.createObjectURL(blob);
  a.download = `accounts-backup-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast("备份文件已下载");
}

/* ================= 公告管理 ================= */
const ANN_API = API_URL.replace('accounts.json','ann.json');

async function openAnn(){
  try {
    const r = await fetch(ANN_API + "?t=" + Date.now(), { headers: HEAD() });
    if(r.ok){
      const j = await r.json();
      const a = JSON.parse(unb64(j.content));
      document.getElementById("annTitle").value = a.title || "";
      document.getElementById("annBody").value = (a.bars && a.bars.length) ? a.bars.join("\n") : (a.body || "");
    } else if(r.status === 404){
      document.getElementById("annTitle").value = "";
      document.getElementById("annBody").value = "";
    } else {
      toast("读取公告失败：" + r.status, true); return;
    }
  } catch(e){
    toast("读取公告出错：" + e.message, true); return;
  }
  document.getElementById("annMask").classList.add("show");
}
function closeAnn(){ document.getElementById("annMask").classList.remove("show"); }
document.getElementById("annMask").addEventListener("click", e=>{ if(e.target.id==="annMask") closeAnn(); });

async function saveAnn(){
  const title = document.getElementById("annTitle").value.trim();
  const body = document.getElementById("annBody").value;
  const bars = body.split("\n").map(s=>s.trim()).filter(Boolean);
  if(!title){ toast("请填写公告标题", true); return; }
  const btn = document.getElementById("annSave");
  btn.disabled = true; btn.textContent = "保存中…";
  const content = JSON.stringify({ title, bars }, null, 2);
  try {
    const r0 = await fetch(ANN_API + "?t=" + Date.now(), { headers: HEAD() });
    let sha = null;
    if(r0.ok){ const j0 = await r0.json(); sha = j0.sha; }
    const body2 = { message:"更新公告内容", content: b64(content), branch: GH_BRANCH };
    if(sha) body2.sha = sha;
    const resp = await fetch(ANN_API, { method:"PUT", headers:{ ...HEAD(), "Content-Type":"application/json" }, body: JSON.stringify(body2) });
    if(!resp.ok){ const ej = await resp.json().catch(()=>({})); throw new Error(resp.status + " " + (ej.message || "")); }
    btn.disabled = false; btn.textContent = "保存";
    closeAnn();
    toast("公告已更新，展示页几十秒内生效");
  } catch(e){
    btn.disabled = false; btn.textContent = "保存";
    toast("保存公告失败：" + e.message, true);
    console.error(e);
  }
}

/* 启动 */
if(sessionStorage.getItem("dr_admin") === "1") reload();
